name: CI Pipeline
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Instalar dependencias
      run: |
        pip install pytest
    - name: Ejecutar pruebas
      run: |
        pytest
    - name: Build proyecto
      run: |
        mkdir artefactos
        cp calculadora.py artefactos/
    - name: Generar ZIP
      run: |
        zip -r artefacto.zip artefactos
    - name: Subir artefacto
      uses: actions/upload-artifact@v4
      with:
        name: build-python
        path: artefacto.zip
